name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python }} · ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The three dependency combinations the app is verified against.
          # The pinned jobs matter: pandas 3.0 was a breaking release, and a
          # public repo whose requirements claim a range nobody has tested
          # collects issues on day one.
          - python: "3.11"
            label: "pinned floor (pandas 2.2, numpy 1.26)"
            pins: "numpy==1.26.4 pandas==2.2.3 scipy==1.13.1"
          - python: "3.12"
            label: "pandas 2.x"
            pins: "'pandas>=2.3,<3'"
          - python: "3.12"
            label: "latest"
            pins: ""
          - python: "3.13"
            label: "latest"
            pins: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -n "${{ matrix.pins }}" ]; then pip install ${{ matrix.pins }}; fi
          pip install pytest

      - name: Show resolved versions
        run: pip list | grep -Ei '^(numpy|pandas|scipy|streamlit|plotly|pyarrow) '

      - name: Run tests
        run: pytest tests/ -q --durations=10

  smoke:
    name: app starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Boot the app and check it serves
        run: |
          streamlit run app.py --server.port 8501 --server.headless true &
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://localhost:8501; then
              echo "app is serving"; exit 0
            fi
            sleep 3
          done
          echo "app did not start within 120s"; exit 1
